name: Validate catalog
on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python scripts/build_catalog.py --check
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/test_site.cjs
      - run: sudo apt-get update && sudo apt-get install -y lua5.4
      - run: lua5.4 tests/test_examples.lua
      - run: python scripts/package_mods.py --output /tmp/ccb-mod-packages
