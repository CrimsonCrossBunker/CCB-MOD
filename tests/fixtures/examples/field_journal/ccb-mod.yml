description:
  zh-Hans: "可交互的手册：查看当地天气、记录观察次数，角色记录随存档保存和恢复。"
  en: "An interactive notebook: read local weather and record observations with a per-character counter that survives saving and loading."
play_notes:
  zh-Hans: "新世界启用后获得手册，使用它选择“记录观察”或“查看天气”。保存重载后记录次数仍在。可用一张纸制作替代手册。"
  en: "Enable in a new world to receive the journal. Activate it, choose Record observation or Read weather. Save and reload to check the counter. Craft a replacement from one paper sheet."
